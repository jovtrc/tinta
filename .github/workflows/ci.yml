# Standards, types, build, PHP tests (single site and multisite), e2e tests
# (Chrome, Firefox and Safari's engine), and Plugin Check on the release contents.
name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Standards and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: composer run phpcs
      - run: composer run phpstan
      - run: pnpm typecheck
      - run: pnpm lint:js
      - run: pnpm lint:css

  php:
    name: PHP tests (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [ single, multisite ]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm wp-env:test start
      - run: pnpm test:php
        if: matrix.site == 'single'
      - run: pnpm test:php:multisite
        if: matrix.site == 'multisite'

  e2e:
    name: E2E tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit ]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts-${{ matrix.browser }}
          path: artifacts/
          retention-days: 7

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bin/build-zip.sh "$RUNNER_TEMP"
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ${{ runner.temp }}/liber
