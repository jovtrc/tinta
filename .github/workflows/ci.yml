# Standards, types, build, PHP tests (single site and multisite), e2e tests, and
# Plugin Check on the release contents. Pushes and pull requests run e2e in
# Chrome; releases (through workflow_call), the weekly run and manual runs add
# Firefox and Safari's engine. Changes to docs and plugin page assets alone skip CI.
name: CI

on:
  push:
    branches: [ trunk ]
    paths-ignore:
      - '**.md'
      - '.wordpress-org/**'
      - 'prototype/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.wordpress-org/**'
      - 'prototype/**'
      - 'LICENSE'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      all-browsers:
        description: Run e2e in Firefox and WebKit too
        type: boolean
        default: true
  workflow_call:
    inputs:
      all-browsers:
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Standards and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: composer run phpcs
      - run: composer run phpstan
      - run: pnpm typecheck
      - run: pnpm lint:js
      - run: pnpm lint:css

  php:
    name: PHP tests (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [ single, multisite ]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm wp-env:test start
      - run: pnpm test:php
        if: matrix.site == 'single'
      - run: pnpm test:php:multisite
        if: matrix.site == 'multisite'

  e2e:
    name: E2E tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON( ( inputs.all-browsers || github.event_name == 'schedule' ) && '["chromium","firefox","webkit"]' || '["chromium"]' ) }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts-${{ matrix.browser }}
          path: artifacts/
          retention-days: 7

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bin/build-zip.sh "$RUNNER_TEMP"
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ${{ runner.temp }}/tinta
