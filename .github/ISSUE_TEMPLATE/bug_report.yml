name: Bug report
description: Something in Tinta doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the workspace
        2. …
    validations:
      required: true
  - type: input
    id: tinta
    attributes:
      label: Tinta version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: wordpress
    attributes:
      label: WordPress and PHP versions
      placeholder: WordPress 7.1.4, PHP 8.3
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 150 on macOS
  - type: dropdown
    id: site
    attributes:
      label: Site type
      options:
        - Single site
        - Multisite
  - type: textarea
    id: plugins
    attributes:
      label: Other active plugins
      description: Optional. If the problem goes away with other plugins turned off, say which one causes it.
